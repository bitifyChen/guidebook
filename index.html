<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover,minimum-scale=1, maximum-scale=1,user-scalable=no"
    />
    <title>Guidebook</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Guidebook" />
    <meta name="theme-color" content="#FF8C00" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        margin: 0;
        padding: 0;
        background: #fff4e6;
      }
      :root {
        --el-color-primary: #ff8c00;
      }
      .app-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff4e6;
        color: #1e293b;
      }
      .app-boot-card {
        width: min(280px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .app-boot-icon {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(255, 140, 0, 0.25);
      }
      .app-boot-title {
        font-size: 18px;
        font-weight: 900;
        line-height: 1.2;
      }
      .app-boot-text {
        font-size: 12px;
        font-weight: 700;
        color: #94a3b8;
      }
      .app-boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 140, 0, 0.2);
        border-top-color: #ff8c00;
        border-radius: 999px;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-B40IzeVQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BBweYIwA.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="app">
      <div class="app-boot-screen" data-front-boot-screen>
        <div class="app-boot-card">
          <img class="app-boot-icon" src="/192.png" alt="Guidebook" />
          <div>
            <div class="app-boot-title">Guidebook</div>
            <div class="app-boot-text">正在載入旅程資料</div>
          </div>
          <div class="app-boot-spinner"></div>
        </div>
      </div>
    </div>
    <script>
      if (location.pathname.startsWith('/admin')) {
        document.querySelector('[data-front-boot-screen]')?.remove();
      }
    </script>
  </body>
</html>
