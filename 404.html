<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover,minimum-scale=1, maximum-scale=1,user-scalable=no"
    />
    <title>Guidebook</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Guidebook" />
    <meta name="theme-color" content="#136A70" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        margin: 0;
        padding: 0;
        background: #136a70;
      }
      :root {
        --el-color-primary: #ff8c00;
      }
      .app-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #136a70;
        color: #fff;
      }
      .app-boot-card {
        width: min(280px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
      }
      .app-boot-text {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.84);
      }
      .app-boot-spinner {
        width: 48px;
        height: 48px;
        border: 2px solid rgba(255, 255, 255, 0.24);
        border-top-color: #fff;
        border-radius: 999px;
        animation: app-boot-spin 1s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-D-GGPbvH.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D8GdcPxc.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="app">
      <div
        class="app-boot-screen"
        data-front-boot-screen
        role="status"
        aria-label="正在載入旅程"
      >
        <div class="app-boot-card">
          <div class="app-boot-spinner" aria-hidden="true"></div>
          <div class="app-boot-text">正在準備旅程</div>
        </div>
      </div>
    </div>
    <script>
      if (location.pathname.startsWith('/admin')) {
        document.querySelector('[data-front-boot-screen]')?.remove();
      }
    </script>
  </body>
</html>
